}
function dashAgenda(T){
  const items=AS().items;
  const nT=items.filter(i=>i.kind==='task'&&!i.done&&i.date&&i.date<=T).length;
  const evs=items.filter(i=>i.kind==='event'&&agOccursOn(i,T)).length;
  const late=items.filter(i=>i.kind==='task'&&!i.done&&i.date&&i.date<T).length;
  const noDate=items.filter(i=>i.kind==='task'&&!i.done&&!i.date).length;
  let b='<b>'+nT+' tâche'+(nT>1?'s':'')+' · '+evs+' rendez-vous</b>'+TT('aujourd’hui');
  if(late)b+=tAlert(late+' tâche'+(late>1?'s':'')+' en retard');
  const hm=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  const next=agEntries(T).filter(e=>e.date&&e.date>=T&&!(e.it.kind==='event'&&e.date===T&&e.it.time&&e.it.time<hm)).slice(0,3);
  if(next.length)b+='<ul class="dt-list">'+next.map(e=>'<li><span class="k">'+esc(e.date===T?(e.it.time||'Auj.'):(diff(e.date,T)===1?'Demain':cap(wd(e.date))+' '+parse(e.date).getDate())+(e.it.time?' '+e.it.time:''))+'</span><span>'+esc(e.it.title)+'</span></li>').join('')+'</ul>';

function dashFin(T){
  const F=FS(),ym=ymOf(T),oc=monthOcc(ym);
  const inc=sum(oc.filter(o=>o.it.kind==='in'),o=>o.it.amount);
  const fix=sum(oc.filter(o=>o.it.kind==='out'),o=>o.it.amount);
  const txm=F.tx.filter(t=>ymOf(t.date)===ym),spent=sum(txm,t=>t.amount);
  const rest=inc-fix-(F.goal||0),left=rest-spent;
  const dueToday=oc.filter(o=>o.it.kind==='out'&&o.date===T&&!F.paid[o.key]);
  const todo=sum(oc.filter(o=>o.it.kind==='out'&&o.date<T&&!F.paid[o.key]),o=>o.it.amount);
  const nxt=oc.concat(monthOcc(addMonths(ym,1))).filter(o=>o.it.kind==='out'&&o.date>T&&!F.paid[o.key])[0];
  const by={};txm.forEach(t=>{by[t.cat]=(by[t.cat]||0)+t.amount;});
  const over=Object.keys(VCATS).filter(k=>F.limits[k]>0&&(by[k]||0)>F.limits[k]);
  let b='<b>'+money(left)+'</b><span class="dt-row">'+TT(left<0?'de dépassement ce mois-ci':'disponibles ce mois-ci')+TT(money(spent)+' dépensés')+'</span>';
  if(rest>0||spent>0)b+=tBar(rest>0?spent/rest:1,money(spent)+' dépensés sur '+money(Math.max(rest,0)));
  dueToday.slice(0,2).forEach(o=>{b+=tAlert('À payer aujourd’hui : '+esc(o.it.name)+' · '+money(o.it.amount));});
  if(dueToday.length>2)b+=tAlert('et '+(dueToday.length-2)+' autre'+(dueToday.length>3?'s':'')+' paiement'+(dueToday.length>3?'s':'')+' du jour');
  if(over.length)b+=tAlert('Plafond dépassé : '+over.map(k=>esc(VCATS[k][0])).join(', '));
  if(nxt){const d=diff(nxt.date,T);b+=TT('Prochaine échéance : '+esc(nxt.it.name)+' · '+money(nxt.it.amount)+' ('+(d===1?'demain':'dans '+d+' j')+')');}
  if(todo>0)b+=TT(money(todo)+' d’échéances passées à pointer');
  return dashTile('fin','Finances',b,dueToday.length||todo>0?'due':over.length?'budget':'');
}
function dashMus(T){
  const S=MS(),days=new Set(S.sessions.map(s=>s.date)),mon=monday(T),goal=S.goal;
  const wk={};days.forEach(d=>{const m=monday(d);wk[m]=(wk[m]||0)+1;});
  const n=wk[mon]||0;
  let w=mon;if((wk[w]||0)<goal)w=addDays(w,-7);
  let streak=0;while((wk[w]||0)>=goal&&streak<520){streak++;w=addDays(w,-7);}
  let b='<b>'+n+' séance'+(n>1?'s':'')+' sur '+goal+'</b>'+TT(n>=goal?'objectif de la semaine atteint':'cette semaine');
  b+='<span class="dt-week" role="img" aria-label="Séances cette semaine : '+n+'">'+['L','M','M','J','V','S','D'].map((l,i)=>{const d=addDays(mon,i);return '<span class="'+(days.has(d)?'on':'')+(d===T?' today':'')+'">'+l+'</span>';}).join('')+'</span>';
  const D=S.draft;
  if(D&&D.entries&&D.entries.length)b+=tAlert('Séance en cours : '+D.entries.length+' exercice'+(D.entries.length>1?'s':'')+' non enregistré'+(D.entries.length>1?'s':''));
  const last=S.sessions.filter(s=>s.date<=T).sort((a,c)=>a.date<c.date?1:-1)[0];
  if(last){const g=diff(T,last.date);b+=TT('Dernière séance : '+(g===0?'aujourd’hui':g===1?'hier':'il y a '+g+' jours')+' · '+esc(last.entries.map(e=>exName(e.ex)).slice(0,2).join(', '))+(last.entries.length>2?'…':''));}
  else b+=TT('Aucune séance enregistrée');
  const all=S.weights.slice().sort((a,c)=>a.date<c.date?-1:1),lw=all[all.length-1];
  if(lw){
    const ref=all.filter(x=>x.date>=addDays(lw.date,-30)&&x!==lw)[0];
    let wl='Poids : '+kgf(lw.kg)+' kg';
    if(ref){const d=Math.round((lw.kg-ref.kg)*10)/10;wl+=' · '+(d>0?'+':d<0?'−':'')+nf.format(Math.abs(d))+' kg sur 30 j';}
    if(S.wTarget>0)wl+=' · objectif '+kgf(S.wTarget)+' kg';
    b+=TT(wl);
  }
  if(streak>0)b+=TT(streak+' semaine'+(streak>1?'s':'')+' d’objectif tenu');
  return dashTile('mus','Muscu',b,D&&D.entries&&D.entries.length?'seance':'');
}

/* ---------- Compte et synchronisation (Supabase) ---------- */
const Cloud={
  session:null,status:'idle',last:0,pushT:null,retryT:null,syncing:false,refreshP:null,
  load(){try{this.session=JSON.parse(localStorage.getItem('lifehub.session')||'null');}catch(e){this.session=null;}},
  setSession(x){this.session=x;try{if(x)localStorage.setItem('lifehub.session',JSON.stringify(x));else localStorage.removeItem('lifehub.session');}catch(e){}},
  fromToken(j){return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}};},
  refresh(){
    if(this.refreshP)return this.refreshP;
    this.refreshP=(async()=>{
      let r;
      try{r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:this.session.refresh_token})});}
      catch(e){throw {offline:true};}
      if(r.status===400||r.status===401||r.status===403){this.setSession(null);render();throw {auth:true};}
      if(!r.ok)throw {offline:true};
      this.setSession(this.fromToken(await r.json()));
    })().finally(()=>{this.refreshP=null;});
    return this.refreshP;
  },
  async api(path,opt){
    opt=opt||{};
    if(!this.session)throw {auth:true};
    if(this.session.expires_at-60<Date.now()/1000)await this.refresh();
    const go=()=>fetch(SB+path,{method:opt.method||'GET',headers:Object.assign({apikey:SK,Authorization:'Bearer '+this.session.access_token,'Content-Type':'application/json'},opt.headers||{}),body:opt.body});
    let r;
    try{r=await go();}catch(e){throw {offline:true};}
    if(r.status===401){await this.refresh();try{r=await go();}catch(e){throw {offline:true};}}
    return r;
  },
  async auth(mode,email,password){
    let r;
    try{r=await fetch(SB+(mode==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email,password})});}
    catch(e){return {err:'Connexion impossible. Vérifie ta connexion internet.'};}
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok){
      const m=String(j.error_description||j.msg||j.message||'');
      return {err:/invalid login/i.test(m)?'Email ou mot de passe incorrect.':/not confirmed/i.test(m)?'Email non confirmé. Clique sur le lien reçu par mail.':/already registered/i.test(m)?'Un compte existe déjà avec cet email.':/not allowed/i.test(m)?'Les inscriptions sont désactivées.':/at least 6|weak/i.test(m)?'Mot de passe trop court (6 caractères minimum).':(m||'Erreur '+r.status)};
    }
    if(!j.access_token)return {info:'Compte créé. Confirme ton adresse email avec le lien reçu, puis connecte-toi.'};
    this.setSession(this.fromToken(j));return {ok:true};
  },
  dirtyAny(){return Object.keys(stores).some(k=>stores[k].cdirty);},
  paint(){
    const b=document.getElementById('cloud-state');if(b)b.textContent=syncText();
    paintFoot();
  },
  async pull(){
    const r=await this.api('/rest/v1/docs?select=key,data,ts');
    if(!r.ok)throw {http:r.status};
    const rows=await r.json(),by={};let changed=false;
    rows.forEach(x=>{by[x.key]=x;});
    Object.keys(stores).forEach(k=>{
      const st=stores[k],rm=by[k];
      if(rm&&rm.ts>st.ts){
        const d=st.norm(rm.data);
        if(d){st.state=d;st.ts=rm.ts;st.cdirty=false;try{localStorage.setItem(st.lsKey,JSON.stringify(d));localStorage.setItem(st.lsKey+'.ts',String(rm.ts));}catch(e){}changed=true;}
      }else if((!rm||rm.ts<st.ts)&&st.ts>0){st.cdirty=true;}
    });
    return changed;
  },
  async push(){
    for(const k of Object.keys(stores)){
      const st=stores[k];if(!st.cdirty)continue;
      st.cdirty=false;
      const body=JSON.stringify([{user_id:this.session.user.id,key:st.name,data:st.state,ts:st.ts}]);
      let r;
      try{r=await this.api('/rest/v1/docs?on_conflict=user_id,key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body});}
      catch(e){st.cdirty=true;throw e;}
      if(!r.ok){st.cdirty=true;throw {http:r.status};}
    }
  },
  async sync(force){
    if(!CLOUD||!this.session||this.syncing)return;
    const a=document.activeElement;
    if(!force&&a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
    this.syncing=true;
    try{const ch=await this.pull();await this.push();this.status=this.dirtyAny()?'pending':'ok';this.last=Date.now();if(ch)render();}
    catch(e){this.status=e&&e.auth?'auth':'pending';}
    this.syncing=false;this.paint();
    if(this.status==='pending')this.scheduleRetry();
  },
  schedulePush(){this.status='pending';this.paint();clearTimeout(this.pushT);this.pushT=setTimeout(()=>this.flush(),700);},
  async flush(){
    if(!this.session)return;
    if(this.syncing){this.pushT=setTimeout(()=>this.flush(),500);return;}
    this.syncing=true;
    try{await this.push();this.status=this.dirtyAny()?'pending':'ok';this.last=Date.now();}
    catch(e){this.status=e&&e.auth?'auth':'pending';}
    this.syncing=false;this.paint();
    if(this.status==='pending')this.scheduleRetry();
  },
  scheduleRetry(){clearTimeout(this.retryT);this.retryT=setTimeout(()=>this.sync(true),15000);},
  logout(){
    this.setSession(null);clearTimeout(this.pushT);clearTimeout(this.retryT);
    Object.keys(stores).forEach(k=>{
      const st=stores[k];
      try{localStorage.removeItem(st.lsKey);localStorage.removeItem(st.lsKey+'.ts');}catch(e){}
      st.state=st.norm(st.seed());st.ts=0;st.cdirty=false;st.touched=false;st.hadLocal=false;
    });
    this.status='idle';this.last=0;ui.auth.mode='in';ui.auth.msg='';
  }
};

  return {title:'Réglages',autosave:true,tall:true,left:'',right:'<button class="nb b" data-act="app.sheetClose">OK</button>',body:b,
    after:(body,fresh)=>{fillDiag();if(fresh&&d.focus)setTimeout(()=>{const el=document.getElementById(d.focus);if(el){el.scrollIntoView({block:'center'});el.focus();}},350);}};
};
async function fillDiag(){
  const el=document.getElementById('diag');if(!el)return;
  const L=[];
  const add=(ok,t)=>L.push('<li class="'+(ok?'ok':'ko')+'"><b>'+(ok?'OK':'À vérifier')+'</b><span>'+t+'</span></li>');
  const secure=window.isSecureContext;
  add(secure,secure?'Page servie en HTTPS':'La page n’est pas en HTTPS : l’installation est impossible');
  try{
    const href=document.querySelector('link[rel=manifest]');
    if(!href)throw new Error('lien absent');
    const r=await fetch(href.href,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const sizes=(j.icons||[]).map(i=>i.sizes).join(' ');
    const good=j.name&&j.start_url&&j.display&&/192x192/.test(sizes)&&/512x512/.test(sizes);
    add(!!good,good?'Manifeste valide (« '+esc(j.name)+' », icônes 192 et 512 px)':'Manifeste incomplet : nom, start_url, display ou icônes 192/512 manquants');
  }catch(e){add(false,'Manifeste introuvable ou illisible ('+esc(e.message)+')');}
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const st=reg&&(reg.active?'actif':reg.installing?'en cours d’installation':reg.waiting?'en attente':'');
    add(!!(reg&&reg.active),reg&&reg.active?'Service worker actif (mode hors ligne prêt)':st?'Service worker '+st+' : recharge la page':'Service worker absent : le fichier sw.js n’est pas servi');
  }catch(e){add(false,'Service worker indisponible dans ce navigateur');}
  const standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(standalone)add(true,'Tu utilises déjà l’application installée');
  else if(deferredInstall)add(true,'Chrome propose l’installation : utilise le bouton ci-dessous');
  else if(ios)add(false,'Sur iPhone : Partager, puis « Sur l’écran d’accueil » dans Safari');
  else add(false,'Chrome n’a pas proposé l’installation : ouvre le menu ⋮ puis « Installer l’application » (ou « Ajouter à l’écran d’accueil »)');
  const cur=document.getElementById('diag');if(cur)cur.innerHTML=L.join('');
}
function exportData(){
  const out={app:'life-hub',version:1,exported:new Date().toISOString(),data:{}};
  Object.keys(stores).forEach(k=>{out.data[k]=stores[k].state;});
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='life-hub-sauvegarde-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('Sauvegarde exportée');
}
function importData(file){
  const msg=document.getElementById('app-msg');
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j||j.app!=='life-hub'||!j.data)throw new Error('format');
      let n=0;
      Object.keys(stores).forEach(k=>{
        if(!j.data[k])return;
        const d=stores[k].norm(j.data[k]);
        if(d){stores[k].state=d;stores[k].save();n++;}
      });
      if(!n)throw new Error('vide');
      render();toast('Sauvegarde importée');
    }catch(e){if(msg)msg.textContent='Ce fichier n’est pas une sauvegarde Life Hub valide.';}
  };
  r.onerror=()=>{if(msg)msg.textContent='Impossible de lire ce fichier.';};
  r.readAsText(file);
}

fromHash();
render();
lastW=appEl.clientWidth;

/* ---------- hors ligne et stockage durable ---------- */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

/* ---------- sauvegarde partagée (db) ---------- */
(async function(){
  const all=Object.keys(stores).map(k=>stores[k]);
  if(DEMO)return;
  if(CLOUD){if(Cloud.session)Cloud.sync(true);return;}
  try{
    const c=window.claude;
    if(!c||!c.use){all.forEach(s=>setSync(s,'local'));return;}
    const dbn=await c.use('db');
    if(!dbn){all.forEach(s=>setSync(s,'local'));return;}
    for(const st of all){
      try{
        st.ref=dbn.doc(st.docPath);
        const snap=await st.ref.get();
        if(snap.exists){
          const norm=st===plStore?plNorm:st===finStore?finNorm:musNorm;
          const d=norm(snap.data());
          if(d){st.state=d;try{localStorage.setItem(st.lsKey,JSON.stringify(d));}catch(e){}render();}
        }else if(st.hadLocal||st.touched){st.save();}
        setSync(st,'cloud');
        st.ref.onSnapshot(s=>{
          if(s.metadata&&s.metadata.hasPendingWrites||!s.exists)return;
          if(st.dirty||st.saving)return;
          const norm=st===plStore?plNorm:st===finStore?finNorm:musNorm;
          const d=norm(s.data());if(!d)return;
          if(JSON.stringify(d)===JSON.stringify(st.state))return;
          st.state=d;
          const a=document.activeElement;
          if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
          if(MODS[ui.mod].store===st)render();
        },()=>setSync(st,'local'));
      }catch(e){setSync(st,'local');}
    }
  }catch(e){all.forEach(s=>setSync(s,'local'));}
})();
})();
